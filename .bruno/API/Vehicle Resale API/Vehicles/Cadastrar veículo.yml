info:
  name: Cadastrar veículo
  type: http
  seq: 3
  tags:
    - Vehicles

http:
  method: POST
  url: "{{baseUrl}}/vehicles"
  body:
    type: json
    data: |-
      {
        "brand": "",
        "model": "",
        "color": "",
        "year": 0,
        "description": "",
        "price": 0
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Veículo criado com sucesso
    request:
      url: "{{baseUrl}}/vehicles"
      method: POST
      body:
        type: json
        data: |-
          {
            "brand": "",
            "model": "",
            "color": "",
            "year": 0,
            "description": "",
            "price": 0
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "id": 0,
            "brand": "",
            "model": "",
            "color": "",
            "year": 0,
            "description": "",
            "price": 0,
            "status": "AVAILABLE"
          }
  - name: 400 Response
    description: Dados inválidos
    request:
      url: "{{baseUrl}}/vehicles"
      method: POST
      body:
        type: json
        data: |-
          {
            "brand": "",
            "model": "",
            "color": "",
            "year": 0,
            "description": "",
            "price": 0
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""

docs: Cria um novo veículo com status inicial AVAILABLE. Requer role ADMIN.
